name: Release

# Build the desktop release asset and publish it as a GitHub Release.
# Layout since 2026-09 (Tauri shell archived): the release is the PyInstaller
# onedir backend (which serves the SPA and hosts `alas run desktop` via
# pywebview). The installed app's updater (module/webui/updater.py) lists
# releases, downloads the asset and replaces the whole bundle.
# TODO(P0.5): NSIS setup.exe via deploy/packaging/alas_installer.nsi +
# makensis; until then a portable zip is published.

on:
  push:
    # Version tags (vYYYY.MM.DD, e.g. v2026.08.21); see deploy/packaging/README.md
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Main dependency group only; the dev group is not needed to package.
      - name: Sync dependencies
        run: uv sync --frozen --no-group dev

      - name: Build frontend
        working-directory: webapp-tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build backend sidecar
        run: |
          uv tool install "pyinstaller>=6.19"
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          pyinstaller --clean --noconfirm deploy/packaging/alas_backend.spec
          # version.txt = the release tag; the updater reports it as the
          # current version of the running build.
          Set-Content -Path "dist/alas-backend/version.txt" -Value "$env:GITHUB_REF_NAME" -NoNewline

      - name: Build installer (NSIS) or portable zip (P0.5)
        id: build
        shell: pwsh
        run: |
          $nsi = "deploy/packaging/alas_installer.nsi"
          if (Test-Path $nsi) {
            makensis $nsi
            Copy-Item -ErrorAction Stop "dist/Alas_${{ github.ref_name }}_x64-setup.exe" "Alas_${{ github.ref_name }}_x64-setup.exe" -Force
            "asset=Alas_${{ github.ref_name }}_x64-setup.exe" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "alas_installer.nsi not present (P0.5) - publishing portable zip"
            Compress-Archive -Path "dist/alas-backend" -DestinationPath "Alas_${{ github.ref_name }}_x64-portable.zip" -Force
            "asset=Alas_${{ github.ref_name }}_x64-portable.zip" >> $env:GITHUB_OUTPUT
          }
          Get-ChildItem "Alas_*" | ForEach-Object { $_.FullName }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.build.outputs.asset }}
