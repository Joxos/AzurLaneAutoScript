name: CI

on:
  push:
    branches: [master, "refactor/*", "feature/*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      # The whole tree is clean as of 2026-09-29 (the island/island_handler
      # modules adopted from upstream were the last holdouts). If this ever
      # fails, fix the code or annotate the site with a reason - do not widen
      # the scope again.
      - name: Lint
        run: uv run ruff check .

      - name: Type check
        # Scope widened 2026-09-29 to the layers that own runtime state:
        # the webui (manager/queues/tasks), the CLI, the flow engine and the
        # packaging scripts. module/config + module/device + module/flow's CV2
        # callers still carry pre-existing findings and are deliberately out.
        run: >
          uv run pyright module/logger.py module/scheduler module/tasks
          module/webui module/cli module/config/utils.py module/flow
          deploy/packaging tests

      - name: Import smoke (full tree)
        run: uv run python dev_tools/smoke_import_all.py

      - name: Structure verification
        run: |
          uv run python dev_tools/verify_alas_structure.py
          uv run python dev_tools/verify_task_registry.py
          uv run python dev_tools/verify_task_record.py

      - name: Tests
        run: uv run pytest tests -v

      - name: Frontend tests
        working-directory: webapp
        run: pnpm test

      # The log view is laid out by rich on the backend; this gate renders a
      # real log sample through the real frontend pipeline in headless Edge and
      # fails when any line leaves rich's cell grid (the "error box right edge
      # is not aligned" bug).
      - name: Log cell-grid gate
        run: node dev_tools/verify_log_align.mjs

      # Upstream redefines recognition arguments (image_color_count's threshold
      # changed from a similarity floor to a tolerance). This compares every
      # call site against upstream and fails when one of ours kept the old
      # number - the silent "matches everything" class of bug.
      - name: Recognition arguments vs upstream
        run: uv run python dev_tools/verify_thresholds.py --check

      - name: Equivalence gates (Phase 456)
        run: |
          uv run python dev_tools/verify_config_generated.py
          uv run python dev_tools/verify_task_families.py
          uv run python dev_tools/verify_stage_meta.py
          uv run python dev_tools/verify_map_data.py --all
          uv run python dev_tools/gen_log_cell_widths.py --check
          # Re-record after an intentional assets.py change:
          #   uv run python dev_tools/verify_assets.py dump dev_tools/baseline/assets_snapshot.json
          uv run python dev_tools/verify_assets.py check dev_tools/baseline/assets_snapshot.json
          # Upstream writes the per-server dict form everywhere; this restores
          # our collapsed form (semantics identical, checked above).
          uv run python dev_tools/dedup_assets.py --check

      # The image is only built on release (no docker on the agents), so the
      # packaging is checked statically: COPY sources exist and are not
      # excluded by .dockerignore, and the compose context is the repo root.
      - name: Docker packaging
        run: uv run python dev_tools/verify_docker_packaging.py

      # Every row of docs/requirements-matrix.md must still point at a file
      # that exists, on both ends (the artefact and the gate that proves it).
      - name: Requirements matrix
        run: uv run python dev_tools/verify_requirements.py
