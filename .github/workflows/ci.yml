name: CI

on:
  push:
    branches: [master, "refactor/*", "feature/*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      # The lint/type gates are scoped to the directories that are currently
      # clean; widen them as the legacy codebase goes green (module/config,
      # module/core and friends still carry pre-existing findings - the cv2
      # stubs reject scalar/tuple image ops all over module/core).
      - name: Lint (scoped)
        run: uv run ruff check module/alas.py module/logger.py module/scheduler module/tasks module/core module/base module/device module/map_detection tests dev_tools/verify_alas_structure.py

      - name: Type check (scoped)
        run: uv run pyright module/logger.py module/scheduler module/tasks tests

      - name: Import smoke (full tree)
        run: uv run python dev_tools/smoke_import_all.py

      - name: Structure verification
        run: |
          uv run python dev_tools/verify_alas_structure.py
          uv run python dev_tools/verify_task_registry.py
          uv run python dev_tools/verify_task_record.py

      - name: Tests
        run: uv run pytest tests -v

      - name: Frontend tests
        working-directory: webapp
        run: pnpm test

      # The log view is laid out by rich on the backend; this gate renders a
      # real log sample through the real frontend pipeline in headless Edge and
      # fails when any line leaves rich's cell grid (the "error box right edge
      # is not aligned" bug).
      - name: Log cell-grid gate
        run: node dev_tools/verify_log_align.mjs

      - name: Equivalence gates (Phase 456)
        run: |
          uv run python dev_tools/verify_config_generated.py
          uv run python dev_tools/verify_task_families.py
          uv run python dev_tools/verify_stage_meta.py
          uv run python dev_tools/verify_map_data.py --all
          uv run python dev_tools/gen_log_cell_widths.py --check
          # Re-record after an intentional assets.py change:
          #   uv run python dev_tools/verify_assets.py dump dev_tools/baseline/assets_snapshot.json
          uv run python dev_tools/verify_assets.py check dev_tools/baseline/assets_snapshot.json
