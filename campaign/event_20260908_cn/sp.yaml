  battle_7:
    pattern: boss
    kind: fleet_boss
battle_bodies:
  battle_0: |-
    def battle_0(self):
        if self.clear_siren():
            return True
        if self.clear_filter_enemy(self.ENEMY_FILTER, preserve=2):
            return True
        return self.battle_default()
  battle_5: |-
    def battle_5(self):
        if self.clear_siren():
            return True
        if self.clear_filter_enemy(self.ENEMY_FILTER, preserve=0):
            return True
        return self.battle_default()
  battle_7: |-
    def battle_7(self):
        return self.fleet_boss.clear_boss()
