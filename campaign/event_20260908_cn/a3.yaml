config:
  MAP_SIREN_TEMPLATE: []
  MOVABLE_ENEMY_TURN:
  - 2
  MAP_HAS_SIREN: true
  MAP_HAS_MOVABLE_ENEMY: true
  MAP_HAS_MAP_STORY: false
  MAP_HAS_FLEET_STEP: true
  MAP_HAS_AMBUSH: false
  MAP_HAS_MYSTERY: false
roads: {}
selects: {}
actions: []
