imports:
  CampaignBase: campaign_base.CampaignBase
  CampaignMap: module.map.map_base.CampaignMap
  SelectedGrids: module.map.map_grids.SelectedGrids
  RoadGrids: module.map.map_grids.RoadGrids
  logger: module.logger.logger
campaign_base_name: CampaignBase
globals: {}
battles:
  battle_0:
    pattern: clear_filter
    siren: true
    preserve: 0
  battle_4:
    pattern: boss
    kind: clear
battle_bodies:
  battle_0: |-
    def battle_0(self):
        if self.clear_siren():
            return True
        if self.clear_filter_enemy(self.ENEMY_FILTER, preserve=0):
            return True
        return self.battle_default()
  battle_4: |-
    def battle_4(self):
        return self.clear_boss()
